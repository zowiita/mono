<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none" height="44" width="160">
  <style>
    .brand-text {
      font-family: "Satoshi", "Clash Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1.2px;
      fill: #FFFFFF;
    }
    .orange-dot {
      fill: #FF5500;
    }
  </style>
  <!-- Text 'm' -->
  <text x="4" y="32" class="brand-text">m</text>
  
  <!-- 'o' with orange umlauts -->
  <text x="35" y="32" class="brand-text">o</text>
  <!-- The two orange dots for the umlaut over first 'o' -->
  <circle cx="43.5" cy="9.5" r="3.2" class="orange-dot" />
  <circle cx="53.5" cy="9.5" r="3.2" class="orange-dot" />
  
  <!-- Text 'no' -->
  <text x="61" y="32" class="brand-text">no</text>
</svg>
